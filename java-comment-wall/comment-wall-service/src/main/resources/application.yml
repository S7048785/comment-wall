server:
  address: 0.0.0.0
  port: 8080
spring:
  profiles:
    active: dev
  application:
    name: comment-wall-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${comment.wall.datasource.url}
    username: ${comment.wall.datasource.username}
    password: ${comment.wall.datasource.password}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0 # 指定使用Redis的哪个数据库，Redis服务启动后默认有16个数据库，编号分别是从0到15
      lettuce:
        pool:
          max-active: 8 # 最大连接
          max-idle: 8 # 最大空闲连接
          min-idle: 0 # 最小空闲连接
          max-wait: 1000 # 连接等待时间

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: comment.wall.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      update-strategy: not_null

springdoc:
  # 默认是false，需要设置为true
  default-flat-param-object: true
logging:
  level:
    comment:
      wall:
        mapper: debug
        service: info
        controller: info
